name: CodSpeed Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser:
    name: Run parser benchmarks
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          cache-save-if: false

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-codspeed@5.0.3

      - name: Build benchmark
        run: cargo codspeed build -p benchmark --bench parser --features codspeed --measurement-mode simulation,walltime

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5
        with:
          mode: simulation,walltime
          run: cargo codspeed run --bench parser

  simulation:
    name: Run benchmarks (${{ matrix.bench }}, simulation)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bench:
          - visit
          - semantic
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-codspeed@5.0.3

      - name: Build benchmark
        run: cargo codspeed build -p benchmark --bench ${{ matrix.bench }} --features codspeed --measurement-mode simulation

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5
        with:
          mode: simulation
          run: cargo codspeed run --bench ${{ matrix.bench }}
