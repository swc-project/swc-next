name: Profile Performance

# Builds base and head once in an x86_64 job. Separate jobs then run the built
# benchmarks: Gungraun instruction counts and paired Criterion wall times.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-perf.yml'
      - '.github/scripts/paired-walltime.mjs'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'tasks/benchmark/**'
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: Base branch, tag, or full commit SHA
        required: true
        type: string
      head:
        description: Head branch, tag, or full commit SHA (defaults to the dispatch revision)
        type: string
      suite:
        description: Measurements to run
        default: all
        type: choice
        options: [all, walltime, gungraun]
      targets:
        description: Wall-time targets (affected, all, or a comma-separated list such as parser,minifier)
        default: affected
        type: string
      rounds:
        description: Number of wall-time base/head rounds (even; base and head alternate running first)
        default: 6
        type: number
      filter:
        description: Gungraun benchmark filter (empty runs all benchmarks)
        type: string

permissions:
  contents: read

# Unrelated label events get their own group, so they cannot cancel a
# measurement in progress.
concurrency:
  group: profile-perf-${{ (github.event.action == 'labeled' && github.event.label.name != 'Codspeed') && github.run_id || github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build base and head
    # Gungraun runs for every pull request. Wall time runs for pushes to main
    # and for pull requests with the Codspeed label. Other label events do
    # nothing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'Codspeed'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      base-sha: ${{ steps.revisions.outputs.base-sha }}
      head-sha: ${{ steps.revisions.outputs.head-sha }}
      walltime: ${{ steps.revisions.outputs.walltime }}
      walltime-targets: ${{ steps.targets.outputs.targets }}
      gungraun: ${{ steps.revisions.outputs.gungraun }}
      gungraun-built: ${{ steps.gungraun-base.outcome == 'success' && steps.gungraun-head.outcome == 'success' }}
      rustc: ${{ steps.toolchain.outputs.rustc }}
      cargo: ${{ steps.toolchain.outputs.cargo }}
    env:
      BENCHMARK_FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve revisions and preserve the build script
        id: revisions
        env:
          PR_HAS_CODSPEED: ${{ contains(github.event.pull_request.labels.*.name, 'Codspeed') }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          cp .github/scripts/paired-walltime.mjs "$RUNNER_TEMP/paired-walltime.mjs"

          # The filter is a positional benchmark argument, not an option.
          if [[ "$BENCHMARK_FILTER" == -* ]]
          then
            echo 'filter must be a benchmark pattern, not an option' >&2
            exit 1
          fi

          resolve_remote() {
            git fetch --no-tags -- origin "$1" || return $?
            git rev-parse --verify 'FETCH_HEAD^{commit}'
          }

          # A push compares the pushed commit with its first parent. A pull
          # request compares its merge commit with the first parent of that
          # merge commit. For a stacked pull request, GitHub merges the full
          # stack into the latest default branch, so the base branch commit
          # can be on an older default branch. The first parent contains the
          # same default branch commits, so the comparison shows only the
          # changes of this pull request. A manual run compares the two
          # selected revisions.
          case "$GITHUB_EVENT_NAME" in
            push)
              base_sha="$(git rev-parse --verify "${EVENT_SHA}^1^{commit}")"
              head_sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
              walltime=true
              gungraun=false
              ;;
            pull_request)
              base_sha="$(git rev-parse --verify "${EVENT_SHA}^1^{commit}")"
              head_sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
              walltime="$PR_HAS_CODSPEED"
              gungraun=true
              ;;
            workflow_dispatch)
              base_sha="$(resolve_remote "$INPUT_BASE")"
              if [[ -n "$INPUT_HEAD" ]]
              then
                head_sha="$(resolve_remote "$INPUT_HEAD")"
              else
                head_sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
              fi
              walltime="$([[ "$INPUT_SUITE" != gungraun ]] && echo true || echo false)"
              gungraun="$([[ "$INPUT_SUITE" != walltime ]] && echo true || echo false)"
              # Use the head revision's toolchain for both builds.
              git checkout --detach "$head_sha"
              ;;
          esac
          {
            echo "base-sha=$base_sha"
            echo "head-sha=$head_sha"
            echo "walltime=$walltime"
            echo "gungraun=$gungraun"
          } >> "$GITHUB_OUTPUT"
          {
            echo "BASE_SHA=$base_sha"
            echo "HEAD_SHA=$head_sha"
            echo "SCRIPT=$RUNNER_TEMP/paired-walltime.mjs"
            echo "WALLTIME_BIN=$RUNNER_TEMP/walltime-bin"
            echo "GUNGRAUN_BIN=$RUNNER_TEMP/gungraun-bin"
          } >> "$GITHUB_ENV"
          echo "Base: $base_sha, head: $head_sha, wall time: $walltime, Gungraun: $gungraun"

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Keep the same Rust toolchain for base and head
        id: toolchain
        run: |
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          {
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } >> "$GITHUB_OUTPUT"

      # The head revision is checked out here. `affected` keeps only the
      # targets that depend on a file changed between base and head.
      - name: Select wall-time targets
        id: targets
        if: steps.revisions.outputs.walltime == 'true'
        env:
          INPUT_TARGETS: ${{ inputs.targets || 'affected' }}
        run: |
          targets="$(node "$SCRIPT" select "$BASE_SHA" "$HEAD_SHA" "$INPUT_TARGETS")"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "PAIRED_WALLTIME_TARGETS=$targets" >> "$GITHUB_ENV"
          echo "Wall-time targets: ${targets:-none}"

      # Each revision is checked out once. Its wall-time and Gungraun benchmarks
      # use the same `bench` profile and target directory, so Cargo compiles
      # the dependencies once per revision. The measurement jobs run the
      # uploaded executables and do not compile.
      - name: Check out base
        run: git checkout --detach "$BASE_SHA"

      - name: Build base wall-time benchmarks
        if: steps.revisions.outputs.walltime == 'true'
        run: node "$SCRIPT" build "$WALLTIME_BIN/base"

      - name: Build base Gungraun benchmark
        id: gungraun-base
        if: steps.revisions.outputs.gungraun == 'true'
        # A Gungraun build failure must not prevent the wall-time measurement.
        # The Gungraun job fails instead.
        continue-on-error: true
        run: |
          set -o pipefail
          bin="$GUNGRAUN_BIN/base"
          mkdir -p "$bin"

          runner_version="$(cargo metadata --locked --format-version=1 | jq -er '.packages[] | select(.name == "gungraun-runner") | .version')"
          cargo install --locked --version "$runner_version" gungraun-runner
          cp "$(command -v gungraun-runner)" "$bin/gungraun-runner"

          executable="$(cargo bench --locked -p benchmark --bench gungraun --no-run --message-format=json |
            jq -er 'select(.executable != null and .target.name == "gungraun") | .executable')"
          cp "$executable" "$bin/gungraun"

      - name: Check out head
        run: git checkout --detach "$HEAD_SHA"

      - name: Build head wall-time benchmarks
        if: steps.revisions.outputs.walltime == 'true'
        run: node "$SCRIPT" build "$WALLTIME_BIN/head"

      - name: Build head Gungraun benchmark
        id: gungraun-head
        if: steps.gungraun-base.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bin="$GUNGRAUN_BIN/head"
          mkdir -p "$bin"

          runner_version="$(cargo metadata --locked --format-version=1 | jq -er '.packages[] | select(.name == "gungraun-runner") | .version')"
          cargo install --locked --version "$runner_version" gungraun-runner
          cp "$(command -v gungraun-runner)" "$bin/gungraun-runner"

          executable="$(cargo bench --locked -p benchmark --bench gungraun --no-run --message-format=json |
            jq -er 'select(.executable != null and .target.name == "gungraun") | .executable')"
          cp "$executable" "$bin/gungraun"

      # Artifacts do not keep the executable bit, so the binaries go in a tar file.
      - name: Package wall-time benchmarks
        if: steps.revisions.outputs.walltime == 'true'
        run: tar -czf "$RUNNER_TEMP/walltime-bin.tar.gz" -C "$RUNNER_TEMP" walltime-bin

      - name: Upload wall-time benchmarks
        if: steps.revisions.outputs.walltime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-perf-walltime-bin
          path: ${{ runner.temp }}/walltime-bin.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Package Gungraun benchmarks
        if: steps.gungraun-head.outcome == 'success'
        run: tar -czf "$RUNNER_TEMP/gungraun-bin.tar.gz" -C "$RUNNER_TEMP" gungraun-bin

      - name: Upload Gungraun benchmarks
        if: steps.gungraun-head.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-perf-gungraun-bin
          path: ${{ runner.temp }}/gungraun-bin.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  gungraun:
    name: Measure Gungraun instruction counts
    needs: build
    if: needs.build.outputs.gungraun == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ needs.build.outputs.base-sha }}
      HEAD_SHA: ${{ needs.build.outputs.head-sha }}
      BENCHMARK_FILTER: ${{ inputs.filter }}
      GUNGRAUN_ARTIFACT_NAME: gungraun-valgrind-${{ github.run_id }}-${{ github.run_attempt }}
      # Keep the data layout of `cargo bench`, which sets this variable.
      CARGO_PKG_NAME: benchmark
      GUNGRAUN_COLOR: never
    steps:
      # The measurement scripts come from the workflow revision.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Fail when the Gungraun build failed
        if: needs.build.outputs.gungraun-built != 'true'
        run: |
          echo 'The Gungraun benchmark build failed. See the Gungraun steps of the build job.' >&2
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-perf-gungraun-bin
          path: ${{ runner.temp }}

      - name: Install Valgrind and unpack the benchmarks
        id: prepare
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          valgrind --version

          tar -xzf "$RUNNER_TEMP/gungraun-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "GUNGRAUN_BIN=$RUNNER_TEMP/gungraun-bin" >> "$GITHUB_ENV"
          {
            echo "Base SHA: $BASE_SHA"
            echo "Compare SHA: $HEAD_SHA"
          } > "$RUNNER_TEMP/gungraun-revisions.txt"

      # Each revision runs with its own `gungraun-runner`. An explicit
      # workspace root keeps Gungraun from running `cargo metadata`.
      - name: Save base Gungraun benchmark
        run: |
          set -o pipefail

          filter_args=()
          if [[ -n "$BENCHMARK_FILTER" ]]
          then
            filter_args+=("$BENCHMARK_FILTER")
          fi
          PATH="$GUNGRAUN_BIN/base:$PATH" "$GUNGRAUN_BIN/base/gungraun" --bench \
            --workspace-root="$GITHUB_WORKSPACE" \
            --home="$RUNNER_TEMP/gungraun" \
            --callgrind-metrics=Ir \
            --save-baseline=base "${filter_args[@]}" 2>&1 | tee "$RUNNER_TEMP/gungraun-base.txt"

      - name: Compare head Gungraun benchmark
        env:
          GUNGRAUN_SHOW_INTERMEDIATE: true
        run: |
          report="$RUNNER_TEMP/gungraun-diff.txt"
          summary="$RUNNER_TEMP/gungraun-summary.md"
          filter_args=()
          if [[ -n "$BENCHMARK_FILTER" ]]
          then
            filter_args+=("$BENCHMARK_FILTER")
          fi
          set +e
          PATH="$GUNGRAUN_BIN/head:$PATH" "$GUNGRAUN_BIN/head/gungraun" --bench \
            --workspace-root="$GITHUB_WORKSPACE" \
            --home="$RUNNER_TEMP/gungraun" \
            --baseline=base \
            --callgrind-metrics=Ir \
            --save-summary=json "${filter_args[@]}" 2>&1 | tee "$report"
          benchmark_status="${PIPESTATUS[0]}"

          node .github/scripts/render-gungraun-summary.mjs \
            "$RUNNER_TEMP/gungraun" > "$summary"
          summary_status="$?"
          set -e

          if [[ ! -s "$summary" ]]
          then
            {
              echo "### Instruction-count changes"
              echo
              echo "⚠️ **The comparison summary could not be generated.** See the workflow log."
            } > "$summary"
          fi

          {
            echo "## Gungraun benchmark diff"
            echo
            cat "$RUNNER_TEMP/gungraun-revisions.txt"
            echo
            echo 'Values are shown as `compare / base`.'
            echo
            cat "$summary"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$benchmark_status" -ne 0 ]]
          then
            exit "$benchmark_status"
          fi
          exit "$summary_status"

      - name: Prepare Valgrind artifact metadata
        if: always() && steps.prepare.outcome == 'success'
        env:
          BASE_REF: ${{ inputs.base || github.event.pull_request.base.ref }}
          HEAD_REF: ${{ inputs.head || github.event.pull_request.head.ref || github.ref }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
          RUSTC_VERSION: ${{ needs.build.outputs.rustc }}
          CARGO_VERSION: ${{ needs.build.outputs.cargo }}
        run: |
          metadata="$RUNNER_TEMP/gungraun-metadata.json"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gungraun_version="$("$GUNGRAUN_BIN/head/gungraun-runner" --version 2>/dev/null || echo unavailable)"
          valgrind_version="$(valgrind --version 2>/dev/null || echo unavailable)"

          jq -n \
            --arg artifact_name "$GUNGRAUN_ARTIFACT_NAME" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg benchmark_filter "$BENCHMARK_FILTER" \
            --arg benchmark_home "$RUNNER_TEMP/gungraun" \
            --arg cargo_version "${CARGO_VERSION:-unavailable}" \
            --arg compare_sha "$HEAD_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg generated_at "$generated_at" \
            --arg gungraun_bin "$GUNGRAUN_BIN" \
            --arg gungraun_version "$gungraun_version" \
            --arg head_ref "$HEAD_REF" \
            --arg job_status "$JOB_STATUS" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_id "$RUN_ID" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_os "$RUNNER_OS" \
            --arg rustc_version "${RUSTC_VERSION:-unavailable}" \
            --arg valgrind_version "$valgrind_version" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg workspace_root "$GITHUB_WORKSPACE" \
            '{
              schema_version: 2,
              repository: $repository,
              workflow: {
                name: $workflow_name,
                event: $event_name,
                run_id: $run_id,
                run_attempt: ($run_attempt | tonumber),
                run_url: $run_url,
                job_status: $job_status
              },
              comparison: {
                base_ref: $base_ref,
                head_ref: $head_ref,
                base_sha: $base_sha,
                compare_sha: $compare_sha
              },
              pull_request: (if $event_name == "pull_request" then {
                number: ($pr_number | tonumber),
                base_ref: $base_ref,
                head_ref: $head_ref,
                base_sha: $base_sha,
                head_sha: $pr_head_sha,
                compare_sha: $compare_sha
              } else null end),
              runner: {
                os: $runner_os,
                arch: $runner_arch
              },
              tools: {
                rustc: $rustc_version,
                cargo: $cargo_version,
                gungraun_runner: $gungraun_version,
                valgrind: $valgrind_version
              },
              benchmark: {
                package: "benchmark",
                bench: "gungraun",
                baseline: "base",
                filter: $benchmark_filter,
                base_command: ([$gungraun_bin + "/base/gungraun", "--bench", "--workspace-root=" + $workspace_root, "--home=" + $benchmark_home, "--callgrind-metrics=Ir", "--save-baseline=base"] + (if $benchmark_filter == "" then [] else [$benchmark_filter] end) | map(@sh) | join(" ")),
                compare_command: ([$gungraun_bin + "/head/gungraun", "--bench", "--workspace-root=" + $workspace_root, "--home=" + $benchmark_home, "--baseline=base", "--callgrind-metrics=Ir", "--save-summary=json"] + (if $benchmark_filter == "" then [] else [$benchmark_filter] end) | map(@sh) | join(" "))
              },
              files: {
                data_root: "gungraun",
                base_report: "gungraun-base.txt",
                revisions: "gungraun-revisions.txt",
                diff_report: "gungraun-diff.txt",
                rendered_summary: "gungraun-summary.md"
              },
              artifact: {
                name: $artifact_name,
                retention_days: 90
              },
              generated_at: $generated_at
            }' > "$metadata"

          jq -e \
            --arg base_sha "$BASE_SHA" \
            --arg compare_sha "$HEAD_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            '.schema_version == 2 and
             .comparison.base_sha == $base_sha and
             .comparison.compare_sha == $compare_sha and
             (if $event_name == "pull_request" then .pull_request.number > 0 else .pull_request == null end) and
             .files.data_root == "gungraun" and
             .artifact.retention_days == 90' \
            "$metadata" > /dev/null

      - name: Upload Valgrind analysis bundle
        id: upload-valgrind
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.GUNGRAUN_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/gungraun
            ${{ runner.temp }}/gungraun-base.txt
            ${{ runner.temp }}/gungraun-revisions.txt
            ${{ runner.temp }}/gungraun-diff.txt
            ${{ runner.temp }}/gungraun-summary.md
            ${{ runner.temp }}/gungraun-metadata.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Link Valgrind analysis bundle
        if: >-
          always() &&
          steps.upload-valgrind.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
        run: |
          {
            echo "### Valgrind analysis artifact"
            echo
            echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The comment jobs post this body, so this job never gets a write token.
      - name: Prepare comment body
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
        run: |
          comments="$RUNNER_TEMP/comments"
          mkdir -p "$comments"

          report="$RUNNER_TEMP/gungraun-diff.txt"
          summary="$RUNNER_TEMP/gungraun-summary.md"
          if [[ -f "$report" ]]
          then
            {
              echo '## Gungraun benchmark diff'
              echo
              cat "$RUNNER_TEMP/gungraun-revisions.txt"
              echo
              echo 'Values are shown as `compare / base`.'
              echo
              if [[ -n "$ARTIFACT_URL" ]]
              then
                echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
                echo
              fi
              if [[ -s "$summary" ]]
              then
                cat "$summary"
                echo
              fi
              echo '<details>'
              echo '<summary>Benchmark results</summary>'
              echo
              echo '```text'
              cat "$report"
              echo '```'
              echo '</details>'
            } > "$comments/gungraun.md"
          fi

      - name: Upload comment body
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-perf-comments-gungraun
          path: ${{ runner.temp }}/comments
          if-no-files-found: ignore
          retention-days: 7

  walltime:
    name: Measure wall time
    needs: build
    if: needs.build.outputs.walltime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The measurement scripts come from the workflow revision.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-perf-walltime-bin
          path: ${{ runner.temp }}

      - name: Run base and head wall-time benchmarks in rounds
        env:
          PAIRED_WALLTIME_ROUNDS: ${{ inputs.rounds || 6 }}
          PAIRED_WALLTIME_TARGETS: ${{ needs.build.outputs.walltime-targets }}
          # This job has no Rust toolchain; report the one that built both revisions.
          PAIRED_WALLTIME_RUSTC: ${{ needs.build.outputs.rustc }}
        run: |
          tar -xzf "$RUNNER_TEMP/walltime-bin.tar.gz" -C "$RUNNER_TEMP"
          results="$RUNNER_TEMP/paired-walltime"
          mkdir -p "$results"
          node .github/scripts/paired-walltime.mjs run \
            "$RUNNER_TEMP/walltime-bin/base" \
            "$RUNNER_TEMP/walltime-bin/head" \
            "$results/results.json"
          node .github/scripts/paired-walltime.mjs render "$results/results.json" > "$results/summary.md"
          cat "$results/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wall-time results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paired-walltime
          path: |
            ${{ runner.temp }}/paired-walltime/results.json
            ${{ runner.temp }}/paired-walltime/summary.md
          if-no-files-found: error
          retention-days: 90

      # The comment jobs post this body, so this job never gets a write token.
      - name: Prepare comment body
        if: github.event_name != 'workflow_dispatch'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/comments"
          {
            cat "$RUNNER_TEMP/paired-walltime/summary.md"
            echo
            echo "[Workflow run]($RUN_URL)"
          } > "$RUNNER_TEMP/comments/paired-walltime.md"

      - name: Upload comment body
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-perf-comments-walltime
          path: ${{ runner.temp }}/comments
          if-no-files-found: error
          retention-days: 7

  comment-pull-request:
    name: Comment on pull request
    needs: [gungraun, walltime]
    # Fork and Dependabot pull requests get only the job summary.
    if: >-
      always() &&
      (needs.gungraun.result == 'success' || needs.gungraun.result == 'failure' ||
      needs.walltime.result == 'success' || needs.walltime.result == 'failure') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Serialize updates so that two runs cannot both create a comment.
    concurrency:
      group: profile-perf-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # A measurement job uploads no body when it fails early or does not run.
        continue-on-error: true
        with:
          pattern: profile-perf-comments-*
          merge-multiple: true
          path: ${{ runner.temp }}/comments
      - name: Create or update the comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Update only the comment that this workflow created, so every push
          # to the pull request edits the same comment. Extra markers find
          # comments created by earlier workflow versions.
          upsert() {
            local file="$RUNNER_TEMP/comments/$1"
            local marker="$2"
            local markers comment comment_id
            [[ -s "$file" ]] || return 0
            markers="$(printf '%s\n' "${@:2}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            comment="$RUNNER_TEMP/comment.md"
            {
              echo "$marker"
              cat "$file"
            } > "$comment"

            comment_id="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
                jq -r --argjson markers "$markers" \
                  '.[] | select(.user.login == "github-actions[bot]" and (.body as $body | any($markers[]; . as $marker | $body | startswith($marker)))) | .id' |
                head -n 1
            )"
            if [[ -n "$comment_id" ]]
            then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                -F body=@"$comment" > /dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -F body=@"$comment" > /dev/null
            fi
          }

          upsert gungraun.md \
            '<!-- gungraun-benchmark-diff -->' \
            '<!-- gungraun-parser-benchmark-diff -->'
          upsert paired-walltime.md '<!-- paired-walltime-benchmark -->'

  comment-commit:
    name: Comment on commit
    needs: walltime
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-perf-comments-walltime
          path: ${{ runner.temp }}/comments
      - name: Create the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/comments/paired-walltime.md" > /dev/null
