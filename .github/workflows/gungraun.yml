name: Gungraun Benchmarks

on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gungraun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Compare semantic ${{ matrix.profile }} metrics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: instructions
            bench: gungraun
            filter: "gungraun::semantic::*"
          - profile: memory
            bench: gungraun_memory
            filter: "gungraun_memory::semantic::*"
    env:
      GUNGRAUN_COLOR: never
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          toolchain: 1.97.1
          cache-save-if: false

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@0467a72f0c206af5f965e6e70426f9230a1c067a # v1
        with:
          runner-version: 0.19.4

      - name: Test benchmark summary renderer
        run: node --test .github/scripts/render-gungraun-summary.test.mjs

      - name: Save base benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$BASE_SHA"

          # Always run both revisions with the pull request's benchmark
          # definition. Production code still comes from the exact base SHA.
          git checkout "$HEAD_SHA" -- \
            tasks/benchmark/Cargo.toml \
            tasks/benchmark/benches/gungraun.rs \
            tasks/benchmark/benches/gungraun_memory.rs

          cargo bench --quiet -p benchmark --bench '${{ matrix.bench }}' -- \
            --home="$RUNNER_TEMP/gungraun" \
            --save-baseline=base \
            '${{ matrix.filter }}'

      - name: Compare head benchmark
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"

          report="$RUNNER_TEMP/gungraun-diff.txt"
          summary="$RUNNER_TEMP/gungraun-summary.md"
          set +e
          cargo bench --quiet -p benchmark --bench '${{ matrix.bench }}' -- \
            --home="$RUNNER_TEMP/gungraun" \
            --baseline=base \
            --save-summary=json \
            '${{ matrix.filter }}' 2>&1 | tee "$report"
          benchmark_status="${PIPESTATUS[0]}"

          node .github/scripts/render-gungraun-summary.mjs \
            "$RUNNER_TEMP/gungraun" > "$summary"
          summary_status="$?"
          set -e

          if [[ ! -s "$summary" ]]
          then
            {
              echo "### Instruction-count changes"
              echo
              echo "⚠️ **The comparison summary could not be generated.** See the workflow log."
            } > "$summary"
          fi

          {
            echo "## Gungraun benchmark diff"
            echo
            echo 'Values are shown as `head | base`.'
            echo
            cat "$summary"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$benchmark_status" -ne 0 ]]
          then
            exit "$benchmark_status"
          fi
          exit "$summary_status"

      - name: Upload benchmark profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gungraun-semantic-${{ matrix.profile }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/gungraun
            ${{ runner.temp }}/gungraun-diff.txt
            ${{ runner.temp }}/gungraun-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish benchmark diff to pull request
        if: >-
          always() &&
          matrix.profile == 'instructions' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report="$RUNNER_TEMP/gungraun-diff.txt"
          if [[ ! -f "$report" ]]
          then
            exit 0
          fi

          summary="$RUNNER_TEMP/gungraun-summary.md"
          comment="$RUNNER_TEMP/gungraun-comment.md"
          {
            echo '<!-- gungraun-benchmark-diff -->'
            echo '## Gungraun benchmark diff'
            echo
            echo 'Values are shown as `head | base`.'
            echo
            if [[ -s "$summary" ]]
            then
              cat "$summary"
              echo
            fi
            echo '<details>'
            echo '<summary>Benchmark results</summary>'
            echo
            echo '```text'
            cat "$report"
            echo '```'
            echo '</details>'
          } > "$comment"

          comment_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq \
              'map(select((.body | contains("<!-- gungraun-benchmark-diff -->")) or (.body | contains("<!-- gungraun-parser-benchmark-diff -->"))))[0].id // empty'
          )"

          if [[ -n "$comment_id" ]]
          then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$comment"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$comment"
          fi
