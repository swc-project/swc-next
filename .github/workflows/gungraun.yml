name: Gungraun Benchmarks

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch, tag, or commit SHA
        required: true
        type: string
      head_ref:
        description: Compare branch, tag, or commit SHA (defaults to dispatch revision)
        type: string
      filter:
        description: Gungraun benchmark filter (empty runs all benchmarks)
        type: string
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gungraun-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Compare Gungraun benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCHMARK_FILTER: ${{ inputs.filter }}
      ARTIFACT_NAME: gungraun-valgrind-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve comparison revisions and preserve reporting code
        id: revisions
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          cp .github/scripts/render-gungraun-summary.mjs "$RUNNER_TEMP/render-gungraun-summary.mjs"

          # Cargo appends --bench, so a second -- cannot delimit the filter.
          if [[ "$BENCHMARK_FILTER" == -* ]]
          then
            echo 'filter must be a benchmark pattern, not an option' >&2
            exit 1
          fi

          resolve_remote() {
            git fetch --no-tags -- origin "$1" || return $?
            git rev-parse --verify 'FETCH_HEAD^{commit}'
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          then
            [[ -n "$BASE_REF" ]] || { echo 'base_ref is required' >&2; exit 1; }
            base_sha="$(resolve_remote "$BASE_REF")"
            if [[ -n "$HEAD_REF" ]]
            then
              compare_sha="$(resolve_remote "$HEAD_REF")"
            else
              compare_sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
            fi
          else
            base_sha="$(git rev-parse --verify "${BASE_REF}^{commit}")"
            compare_sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
          fi

          {
            echo "base_sha=$base_sha"
            echo "compare_sha=$compare_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Base SHA: $base_sha"
            echo "Compare SHA: $compare_sha"
          } > "$RUNNER_TEMP/gungraun-revisions.txt"
          cat "$RUNNER_TEMP/gungraun-revisions.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          cache-save-if: false

      - name: Keep the same Rust toolchain for base and compare
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          valgrind --version

      - name: Save base benchmark
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
          GUNGRAUN_COLOR: never
        run: |
          git checkout --detach "$BASE_SHA"

          # Bootstrap the benchmark harness while this workflow is not on the
          # base branch yet. Later PRs benchmark the base branch as-is.
          if ! git cat-file -e \
            "${BASE_SHA}:tasks/benchmark/benches/gungraun.rs" 2>/dev/null
          then
            git checkout "$COMPARE_SHA" -- \
              Cargo.toml \
              Cargo.lock \
              tasks/benchmark/Cargo.toml \
              tasks/benchmark/benches/gungraun.rs
          fi

          runner_version="$(cargo metadata --locked --format-version=1 | jq -er '.packages[] | select(.name == "gungraun-runner") | .version')"
          cargo install --locked --version "$runner_version" gungraun-runner
          gungraun-runner --version

          filter_args=()
          if [[ -n "$BENCHMARK_FILTER" ]]
          then
            filter_args+=("$BENCHMARK_FILTER")
          fi
          cargo bench --quiet --locked -p benchmark --bench gungraun -- \
            --home="$RUNNER_TEMP/gungraun" \
            --callgrind-metrics=Ir \
            --save-baseline=base "${filter_args[@]}" 2>&1 | tee "$RUNNER_TEMP/gungraun-base.txt"

      - name: Compare head benchmark
        env:
          COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
          GUNGRAUN_COLOR: never
          GUNGRAUN_SHOW_INTERMEDIATE: true
        run: |
          git checkout --detach "$COMPARE_SHA"

          runner_version="$(cargo metadata --locked --format-version=1 | jq -er '.packages[] | select(.name == "gungraun-runner") | .version')"
          cargo install --locked --version "$runner_version" gungraun-runner
          gungraun-runner --version

          report="$RUNNER_TEMP/gungraun-diff.txt"
          summary="$RUNNER_TEMP/gungraun-summary.md"
          filter_args=()
          if [[ -n "$BENCHMARK_FILTER" ]]
          then
            filter_args+=("$BENCHMARK_FILTER")
          fi
          set +e
          cargo bench --quiet --locked -p benchmark --bench gungraun -- \
            --home="$RUNNER_TEMP/gungraun" \
            --baseline=base \
            --callgrind-metrics=Ir \
            --save-summary=json "${filter_args[@]}" 2>&1 | tee "$report"
          benchmark_status="${PIPESTATUS[0]}"

          node "$RUNNER_TEMP/render-gungraun-summary.mjs" \
            "$RUNNER_TEMP/gungraun" > "$summary"
          summary_status="$?"
          set -e

          if [[ ! -s "$summary" ]]
          then
            {
              echo "### Instruction-count changes"
              echo
              echo "⚠️ **The comparison summary could not be generated.** See the workflow log."
            } > "$summary"
          fi

          {
            echo "## Gungraun benchmark diff"
            echo
            cat "$RUNNER_TEMP/gungraun-revisions.txt"
            echo
            echo 'Values are shown as `compare / base`.'
            echo
            cat "$summary"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$benchmark_status" -ne 0 ]]
          then
            exit "$benchmark_status"
          fi
          exit "$summary_status"

      - name: Prepare Valgrind artifact metadata
        if: always()
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.ref }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          metadata="$RUNNER_TEMP/gungraun-metadata.json"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rustc_version="$(rustc --version 2>/dev/null || echo unavailable)"
          cargo_version="$(cargo --version 2>/dev/null || echo unavailable)"
          gungraun_version="$(gungraun-runner --version 2>/dev/null || echo unavailable)"
          valgrind_version="$(valgrind --version 2>/dev/null || echo unavailable)"

          jq -n \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg benchmark_filter "$BENCHMARK_FILTER" \
            --arg benchmark_home "$RUNNER_TEMP/gungraun" \
            --arg cargo_version "$cargo_version" \
            --arg compare_sha "$COMPARE_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg generated_at "$generated_at" \
            --arg gungraun_version "$gungraun_version" \
            --arg head_ref "$HEAD_REF" \
            --arg job_status "$JOB_STATUS" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_id "$RUN_ID" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_os "$RUNNER_OS" \
            --arg rustc_version "$rustc_version" \
            --arg valgrind_version "$valgrind_version" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            '{
              schema_version: 2,
              repository: $repository,
              workflow: {
                name: $workflow_name,
                event: $event_name,
                run_id: $run_id,
                run_attempt: ($run_attempt | tonumber),
                run_url: $run_url,
                job_status: $job_status
              },
              comparison: {
                base_ref: $base_ref,
                head_ref: $head_ref,
                base_sha: $base_sha,
                compare_sha: $compare_sha
              },
              pull_request: (if $event_name == "pull_request" then {
                number: ($pr_number | tonumber),
                base_ref: $base_ref,
                head_ref: $head_ref,
                base_sha: $base_sha,
                head_sha: $pr_head_sha,
                compare_sha: $compare_sha
              } else null end),
              runner: {
                os: $runner_os,
                arch: $runner_arch
              },
              tools: {
                rustc: $rustc_version,
                cargo: $cargo_version,
                gungraun_runner: $gungraun_version,
                valgrind: $valgrind_version
              },
              benchmark: {
                package: "benchmark",
                bench: "gungraun",
                baseline: "base",
                filter: $benchmark_filter,
                base_command: (["cargo", "bench", "--quiet", "--locked", "-p", "benchmark", "--bench", "gungraun", "--", "--home=" + $benchmark_home, "--callgrind-metrics=Ir", "--save-baseline=base"] + (if $benchmark_filter == "" then [] else [$benchmark_filter] end) | map(@sh) | join(" ")),
                compare_command: (["cargo", "bench", "--quiet", "--locked", "-p", "benchmark", "--bench", "gungraun", "--", "--home=" + $benchmark_home, "--baseline=base", "--callgrind-metrics=Ir", "--save-summary=json"] + (if $benchmark_filter == "" then [] else [$benchmark_filter] end) | map(@sh) | join(" "))
              },
              files: {
                data_root: "gungraun",
                base_report: "gungraun-base.txt",
                revisions: "gungraun-revisions.txt",
                diff_report: "gungraun-diff.txt",
                rendered_summary: "gungraun-summary.md"
              },
              artifact: {
                name: $artifact_name,
                retention_days: 90
              },
              generated_at: $generated_at
            }' > "$metadata"

          jq -e \
            --arg base_sha "$BASE_SHA" \
            --arg compare_sha "$COMPARE_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            '.schema_version == 2 and
             .comparison.base_sha == $base_sha and
             .comparison.compare_sha == $compare_sha and
             (if $event_name == "pull_request" then .pull_request.number > 0 else .pull_request == null end) and
             .files.data_root == "gungraun" and
             .artifact.retention_days == 90' \
            "$metadata" > /dev/null

      - name: Upload Valgrind analysis bundle
        id: upload-valgrind
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/gungraun
            ${{ runner.temp }}/gungraun-base.txt
            ${{ runner.temp }}/gungraun-revisions.txt
            ${{ runner.temp }}/gungraun-diff.txt
            ${{ runner.temp }}/gungraun-summary.md
            ${{ runner.temp }}/gungraun-metadata.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Link Valgrind analysis bundle
        if: >-
          always() &&
          steps.upload-valgrind.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
        run: |
          {
            echo "### Valgrind analysis artifact"
            echo
            echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark diff to pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report="$RUNNER_TEMP/gungraun-diff.txt"
          if [[ ! -f "$report" ]]
          then
            exit 0
          fi

          summary="$RUNNER_TEMP/gungraun-summary.md"
          comment="$RUNNER_TEMP/gungraun-comment.md"
          {
            echo '<!-- gungraun-benchmark-diff -->'
            echo '## Gungraun benchmark diff'
            echo
            cat "$RUNNER_TEMP/gungraun-revisions.txt"
            echo
            echo 'Values are shown as `compare / base`.'
            echo
            if [[ -n "$ARTIFACT_URL" ]]
            then
              echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
              echo
            fi
            if [[ -s "$summary" ]]
            then
              cat "$summary"
              echo
            fi
            echo '<details>'
            echo '<summary>Benchmark results</summary>'
            echo
            echo '```text'
            cat "$report"
            echo '```'
            echo '</details>'
          } > "$comment"

          comment_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq \
              'map(select((.body | contains("<!-- gungraun-benchmark-diff -->")) or (.body | contains("<!-- gungraun-parser-benchmark-diff -->"))))[0].id // empty'
          )"

          if [[ -n "$comment_id" ]]
          then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$comment"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$comment"
          fi
