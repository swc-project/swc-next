name: Gungraun inline comparison

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: expr-inline-gungraun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Compare parser CPU events on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_INCREMENTAL: 0
      GUNGRAUN_COLOR: never
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain and profiling tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install --locked --version 0.20.0 gungraun-runner
          rustc -Vv
          gungraun-runner --version
          valgrind --version
          uname -m

      - name: Run two independent base and head comparisons
        run: |
          cp tasks/inline_gungraun/run-comparison.sh "$RUNNER_TEMP/run-comparison.sh"
          bash "$RUNNER_TEMP/run-comparison.sh"

      - name: Upload counts and raw profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expr-inline-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/expr-inline-counts
          retention-days: 90
          if-no-files-found: error
