name: Gungraun Benchmarks

on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gungraun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CODEGEN_FILTER: "gungraun::codegen::*"
  CUMULATIVE_BASE_SHA: 4b2507790b45be79426498d84add70eaa74f285b

jobs:
  benchmarks:
    name: Compare Gungraun benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          toolchain: 1.97.1
          cache-save-if: false

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@0467a72f0c206af5f965e6e70426f9230a1c067a # v1
        with:
          runner-version: 0.19.4

      - name: Save incremental base benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPARE_SHA: ${{ github.sha }}
          GUNGRAUN_COLOR: never
        run: |
          git checkout --detach "$BASE_SHA"

          # Bootstrap the benchmark harness while this workflow is not on the
          # base branch yet. Later PRs benchmark the base branch as-is.
          if ! git cat-file -e \
            "${BASE_SHA}:tasks/benchmark/benches/gungraun.rs" 2>/dev/null
          then
            git checkout "$COMPARE_SHA" -- \
              Cargo.toml \
              Cargo.lock \
              tasks/benchmark/Cargo.toml \
              tasks/benchmark/benches/gungraun.rs
          fi

          cargo bench --quiet -p benchmark --bench gungraun -- \
            --home="$RUNNER_TEMP/gungraun/incremental" \
            --save-baseline=base \
            "$CODEGEN_FILTER"

      - name: Save cumulative trunk benchmark
        env:
          GUNGRAUN_COLOR: never
        run: |
          git checkout --detach "$CUMULATIVE_BASE_SHA"

          cargo bench --quiet -p benchmark --bench gungraun -- \
            --home="$RUNNER_TEMP/gungraun/cumulative" \
            --save-baseline=base \
            "$CODEGEN_FILTER"

      - name: Compare merge benchmark
        env:
          COMPARE_SHA: ${{ github.sha }}
          GUNGRAUN_COLOR: never
        run: |
          git checkout --detach "$COMPARE_SHA"

          benchmark_status=0
          summary_status=0
          for comparison in incremental cumulative
          do
            home="$RUNNER_TEMP/gungraun/$comparison"
            report="$RUNNER_TEMP/gungraun-$comparison-diff.txt"
            summary="$RUNNER_TEMP/gungraun-$comparison-summary.md"

            set +e
            cargo bench --quiet -p benchmark --bench gungraun -- \
              --home="$home" \
              --baseline=base \
              --save-summary=json \
              "$CODEGEN_FILTER" 2>&1 | tee "$report"
            current_benchmark_status="${PIPESTATUS[0]}"

            node .github/scripts/render-gungraun-summary.mjs \
              "$home" > "$summary"
            current_summary_status="$?"
            set -e

            if [[ "$current_benchmark_status" -ne 0 ]]
            then
              benchmark_status="$current_benchmark_status"
            fi
            if [[ "$current_summary_status" -ne 0 ]]
            then
              summary_status="$current_summary_status"
            fi

            if [[ ! -s "$summary" ]]
            then
              {
                echo "### Instruction-count changes"
                echo
                echo "⚠️ **The comparison summary could not be generated.** See the workflow log."
              } > "$summary"
            fi

            {
              echo "## ${comparison^} Gungraun benchmark diff"
              echo
              if [[ "$comparison" == "incremental" ]]
              then
                echo 'Values are shown as `merge | pull request base`.'
              else
                echo 'Values are shown as `merge | frozen trunk`.'
              fi
              echo
              cat "$summary"
              echo
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

          if [[ "$benchmark_status" -ne 0 ]]
          then
            exit "$benchmark_status"
          fi
          exit "$summary_status"

      - name: Annotate retained Callgrind profiles
        if: always()
        run: |
          annotation_root="$RUNNER_TEMP/callgrind-annotations"
          mkdir -p "$annotation_root"
          profile_count=0
          while IFS= read -r -d '' profile
          do
            relative="${profile#"$RUNNER_TEMP/gungraun/"}"
            output_name="${relative//\//__}.txt"
            callgrind_annotate \
              --inclusive=yes \
              --threshold=0.1 \
              --tree=both \
              "$profile" > "$annotation_root/$output_name" 2>&1 || true
            profile_count=$((profile_count + 1))
          done < <(
            find "$RUNNER_TEMP/gungraun" \
              -type f \
              -name 'callgrind.*.out*' \
              -print0
          )
          if [[ "$profile_count" -eq 0 ]]
          then
            echo "No Callgrind profiles were available to annotate." \
              > "$annotation_root/README.txt"
          fi

      - name: Prepare Valgrind artifact metadata
        if: always()
        env:
          ARTIFACT_NAME: gungraun-valgrind-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPARE_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          metadata="$RUNNER_TEMP/gungraun-metadata.json"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rustc_version="$(rustc --version 2>/dev/null || echo unavailable)"
          cargo_version="$(cargo --version 2>/dev/null || echo unavailable)"
          gungraun_version="$(gungraun-runner --version 2>/dev/null || echo unavailable)"
          valgrind_version="$(valgrind --version 2>/dev/null || echo unavailable)"

          jq -n \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg benchmark_filter "$CODEGEN_FILTER" \
            --arg cargo_version "$cargo_version" \
            --arg compare_sha "$COMPARE_SHA" \
            --arg cumulative_base_sha "$CUMULATIVE_BASE_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg generated_at "$generated_at" \
            --arg gungraun_version "$gungraun_version" \
            --arg head_ref "$HEAD_REF" \
            --arg job_status "$JOB_STATUS" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_id "$RUN_ID" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_os "$RUNNER_OS" \
            --arg rustc_version "$rustc_version" \
            --arg valgrind_version "$valgrind_version" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            '{
              schema_version: 2,
              repository: $repository,
              workflow: {
                name: $workflow_name,
                event: $event_name,
                run_id: $run_id,
                run_attempt: ($run_attempt | tonumber),
                run_url: $run_url,
                job_status: $job_status
              },
              pull_request: {
                number: ($pr_number | tonumber),
                base_ref: $base_ref,
                head_ref: $head_ref,
                base_sha: $base_sha,
                head_sha: $pr_head_sha,
                compare_sha: $compare_sha
              },
              runner: {
                os: $runner_os,
                arch: $runner_arch
              },
              tools: {
                rustc: $rustc_version,
                cargo: $cargo_version,
                gungraun_runner: $gungraun_version,
                valgrind: $valgrind_version
              },
              benchmark: {
                package: "benchmark",
                bench: "gungraun",
                baseline: "base",
                filter: $benchmark_filter,
                profile: "bench",
                features: "default",
                allocator: "mimalloc",
                comparisons: {
                  incremental: {
                    base_sha: $base_sha,
                    base_command: ("cargo bench --quiet -p benchmark --bench gungraun -- --home=$RUNNER_TEMP/gungraun/incremental --save-baseline=base " + $benchmark_filter),
                    compare_sha: $compare_sha,
                    compare_command: ("cargo bench --quiet -p benchmark --bench gungraun -- --home=$RUNNER_TEMP/gungraun/incremental --baseline=base --save-summary=json " + $benchmark_filter)
                  },
                  cumulative: {
                    base_sha: $cumulative_base_sha,
                    base_command: ("cargo bench --quiet -p benchmark --bench gungraun -- --home=$RUNNER_TEMP/gungraun/cumulative --save-baseline=base " + $benchmark_filter),
                    compare_sha: $compare_sha,
                    compare_command: ("cargo bench --quiet -p benchmark --bench gungraun -- --home=$RUNNER_TEMP/gungraun/cumulative --baseline=base --save-summary=json " + $benchmark_filter)
                  }
                }
              },
              files: {
                data_root: "gungraun",
                annotation_root: "callgrind-annotations",
                incremental_diff_report: "gungraun-incremental-diff.txt",
                incremental_rendered_summary: "gungraun-incremental-summary.md",
                cumulative_diff_report: "gungraun-cumulative-diff.txt",
                cumulative_rendered_summary: "gungraun-cumulative-summary.md"
              },
              artifact: {
                name: $artifact_name,
                retention_days: 90
              },
              generated_at: $generated_at
            }' > "$metadata"

          jq -e \
            --arg base_sha "$BASE_SHA" \
            --arg compare_sha "$COMPARE_SHA" \
            --arg cumulative_base_sha "$CUMULATIVE_BASE_SHA" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            '.schema_version == 2 and
             .pull_request.base_sha == $base_sha and
             .pull_request.head_sha == $pr_head_sha and
             .pull_request.compare_sha == $compare_sha and
             .benchmark.comparisons.incremental.base_sha == $base_sha and
             .benchmark.comparisons.cumulative.base_sha == $cumulative_base_sha and
             .files.data_root == "gungraun" and
             .artifact.retention_days == 90' \
            "$metadata" > /dev/null

      - name: Upload Valgrind analysis bundle
        id: upload-valgrind
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gungraun-valgrind-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gungraun
            ${{ runner.temp }}/callgrind-annotations
            ${{ runner.temp }}/gungraun-incremental-diff.txt
            ${{ runner.temp }}/gungraun-incremental-summary.md
            ${{ runner.temp }}/gungraun-cumulative-diff.txt
            ${{ runner.temp }}/gungraun-cumulative-summary.md
            ${{ runner.temp }}/gungraun-metadata.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Link Valgrind analysis bundle
        if: >-
          always() &&
          steps.upload-valgrind.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
        run: |
          {
            echo "### Valgrind analysis artifact"
            echo
            echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark diff to pull request
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          incremental_report="$RUNNER_TEMP/gungraun-incremental-diff.txt"
          cumulative_report="$RUNNER_TEMP/gungraun-cumulative-diff.txt"
          if [[ ! -f "$incremental_report" && ! -f "$cumulative_report" ]]
          then
            exit 0
          fi

          incremental_summary="$RUNNER_TEMP/gungraun-incremental-summary.md"
          cumulative_summary="$RUNNER_TEMP/gungraun-cumulative-summary.md"
          comment="$RUNNER_TEMP/gungraun-comment.md"
          {
            echo '<!-- gungraun-benchmark-diff -->'
            echo '## Gungraun benchmark diff'
            echo
            if [[ -n "$ARTIFACT_URL" ]]
            then
              echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
              echo
            fi
            echo '### Incremental comparison'
            echo
            echo 'Values are shown as `merge | pull request base`.'
            echo
            if [[ -s "$incremental_summary" ]]
            then
              cat "$incremental_summary"
              echo
            fi
            echo '<details>'
            echo '<summary>Incremental benchmark results</summary>'
            echo
            echo '```text'
            if [[ -f "$incremental_report" ]]
            then
              cat "$incremental_report"
            fi
            echo '```'
            echo '</details>'
            echo
            echo '### Cumulative comparison'
            echo
            echo 'Values are shown as `merge | frozen trunk`.'
            echo
            if [[ -s "$cumulative_summary" ]]
            then
              cat "$cumulative_summary"
              echo
            fi
            echo '<details>'
            echo '<summary>Cumulative benchmark results</summary>'
            echo
            echo '```text'
            if [[ -f "$cumulative_report" ]]
            then
              cat "$cumulative_report"
            fi
            echo '```'
            echo '</details>'
          } > "$comment"

          comment_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq \
              'map(select((.body | contains("<!-- gungraun-benchmark-diff -->")) or (.body | contains("<!-- gungraun-parser-benchmark-diff -->"))))[0].id // empty'
          )"

          if [[ -n "$comment_id" ]]
          then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$comment"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$comment"
          fi
