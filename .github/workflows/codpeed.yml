name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
    types: ["opened", "reopened", "synchronize"]

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bench:
          - parser
          - visit_compare
          - semantic
          - transform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-codspeed

      - name: Build benchmark
        run: cargo codspeed build --bench ${{ matrix.bench }} --features codspeed

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@d872884a306dd4853acf0f584f4b706cf0cc72a2
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: cargo codspeed run
