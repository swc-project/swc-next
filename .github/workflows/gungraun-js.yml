name: Native Linux build-std experiment
on:
  workflow_dispatch:
  push:
    branches: [chenjiahan/experiment-native-size-linux]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-29
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install pinned nightly and Rust source
        run: rustup toolchain install nightly-2026-10-29 --profile minimal --component rust-src --no-self-update
      - run: pnpm install --frozen-lockfile
      - name: Measure size, verify API, and benchmark
        run: python3 .github/scripts/native-size-linux/run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-size-linux
          retention-days: 30
          path: |
            ${{ runner.temp }}/native-size-linux/*.json
            ${{ runner.temp }}/native-size-linux/*.log
            ${{ runner.temp }}/native-size-linux/base
            ${{ runner.temp }}/native-size-linux/candidate
