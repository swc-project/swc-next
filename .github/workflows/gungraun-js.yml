name: Hashbrown feature size comparison
on:
  workflow_dispatch:
  push:
    branches: [chenjiahan/experiment-native-size-linux]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install pinned stable
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - run: pnpm install --frozen-lockfile
      - name: Compare hashbrown feature sets
        run: python3 .github/scripts/native-size-linux/features.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hashbrown-features-linux
          retention-days: 30
          path: |
            ${{ runner.temp }}/hashbrown-features/*.json
            ${{ runner.temp }}/hashbrown-features/*.log
            ${{ runner.temp }}/hashbrown-features/base/*
            ${{ runner.temp }}/hashbrown-features/candidate/*
