name: Position map small-change experiment
on:
  workflow_dispatch:
  push:
    branches: [chenjiahan/experiment-native-size-linux]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [stable, nightly, std]
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-29
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install pinned nightly and Rust source
        run: rustup toolchain install nightly-2026-10-29 --profile minimal --component rust-src --no-self-update
      - run: pnpm install --frozen-lockfile
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: Install stable
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - name: Compare the position-map change
        env:
          POSITION_MODE: ${{ matrix.mode }}
        run: python3 .github/scripts/native-size-linux/position.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: position-map-${{ matrix.mode }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/position-map/*.json
            ${{ runner.temp }}/position-map/*.log
            ${{ runner.temp }}/position-map/base/*
            ${{ runner.temp }}/position-map/candidate/*
