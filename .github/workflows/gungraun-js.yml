name: JavaScript API Gungraun

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref or SHA
        required: true
        type: string
      head:
        description: Head ref or SHA (must contain the harness)
        required: true
        type: string
      filter:
        description: Case substring, for example parse/underscore
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: gungraun-js-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build shared benchmark inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head }}
      JS_BENCH_FILTER: ${{ inputs.filter || '' }}
      JS_BENCH_SUITE: ${{ github.event_name == 'pull_request' && 'representative' || 'full' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          cache-save-if: false
      - name: Freeze Rust toolchain and paths
        run: |
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "JS_BENCH_PREPARED=$RUNNER_TEMP/gungraun-js-prepared" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
      - name: Install profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install --locked --version 0.20.0 gungraun-runner
      - name: Prepare both revisions and frozen harness
        id: prepare
        run: node .github/scripts/run-gungraun-js.mjs --prepare
      - name: Package runtime inputs
        run: |
          tar -czf "$RUNNER_TEMP/prepared.tar.gz" -C "$RUNNER_TEMP" \
            --exclude='*/target' \
            gungraun-js-prepared/build-metadata.json \
            gungraun-js-prepared/harness \
            gungraun-js-prepared/base/npm/core/src-js \
            gungraun-js-prepared/base/npm/core/package.json \
            gungraun-js-prepared/base/npm/core/node_modules/@swc-next \
            gungraun-js-prepared/base/packages \
            gungraun-js-prepared/head/npm/core/src-js \
            gungraun-js-prepared/head/npm/core/package.json \
            gungraun-js-prepared/head/npm/core/node_modules/@swc-next \
            gungraun-js-prepared/head/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gungraun-js-build
          path: ${{ runner.temp }}/prepared.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true

  measure:
    name: Profile ${{ matrix.case }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      JS_BENCH_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gungraun-js-build
          path: ${{ runner.temp }}
      - name: Prepare profiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          tar -xzf "$RUNNER_TEMP/prepared.tar.gz" -C "$RUNNER_TEMP"
          echo "JS_BENCH_PREPARED=$RUNNER_TEMP/gungraun-js-prepared" >> "$GITHUB_ENV"
          echo "JS_BENCH_OUTPUT=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
      - name: Compare API instruction counts
        run: node .github/scripts/run-gungraun-js.mjs --measure
      - name: Upload profiles and comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gungraun-js-results-${{ matrix.id }}
          path: ${{ runner.temp }}/results
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  repeatability:
    name: Check same-SHA repeatability
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JS_BENCH_CASE: parse/underscore-1.5.2.js
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gungraun-js-build
          path: ${{ runner.temp }}
      - name: Prepare profiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          tar -xzf "$RUNNER_TEMP/prepared.tar.gz" -C "$RUNNER_TEMP"
          echo "JS_BENCH_PREPARED=$RUNNER_TEMP/gungraun-js-prepared" >> "$GITHUB_ENV"
          echo "JS_BENCH_OUTPUT=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
      - name: Compare identical head builds
        run: node .github/scripts/run-gungraun-js.mjs --measure --same-sha
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gungraun-js-repeatability
          path: ${{ runner.temp }}/results
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  report:
    name: Collect JavaScript API comparison
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, measure, repeatability]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gungraun-js-results-*
          path: ${{ runner.temp }}/reports
      - name: Validate and collect all shards
        env:
          JS_BENCH_MATRIX: ${{ needs.prepare.outputs.matrix }}
          JS_BENCH_REPEATABILITY: ${{ needs.repeatability.result }}
        run: node .github/scripts/collect-gungraun-js.mjs "$RUNNER_TEMP/reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-results
        if: always()
        with:
          name: gungraun-js-report
          path: ${{ runner.temp }}/reports
          retention-days: 90
          overwrite: true
      - name: Render benchmark review
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload-results.outputs.artifact-url }}
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head }}
        run: |
          summary="$RUNNER_TEMP/reports/summary.md"
          test -f "$summary" || exit 0
          review="$RUNNER_TEMP/gungraun-js-review.md"
          {
            echo '<!-- gungraun-js-api -->'
            echo '## JavaScript API Gungraun benchmark diff'
            echo
            if [[ -f "$RUNNER_TEMP/reports/revisions.txt" ]]
            then
              cat "$RUNNER_TEMP/reports/revisions.txt"
            else
              echo "Base: \`$BASE_REF\`; compare: \`$HEAD_REF\`"
            fi
            echo
            echo 'Values are shown as `compare / base`.'
            echo
            if [[ -n "$ARTIFACT_URL" ]]
            then
              echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for 90 days)."
              echo
            fi
            cat "$summary"
          } > "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish comparison
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment="$RUNNER_TEMP/gungraun-js-review.md"
          test -f "$comment" || exit 0
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- gungraun-js-api -->"))) | .id' | head -1)"
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$comment"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$comment"
          fi
