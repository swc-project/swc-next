name: Fork CI Links

on:
  workflow_run:
    workflows: [Binary Size, Gungraun Benchmarks, JavaScript API Gungraun]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

# Serialize all reports for the same source branch across revisions.
concurrency:
  group: fork-ci-links-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Keep all privileged code here. Never checkout PR code or read artifacts.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = 'swc-project';
            const repo = 'swc-next';
            const repository = `${owner}/${repo}`;
            const skip = reason => core.info(`Skipping CI link: ${reason}`);
            const event = context.payload.workflow_run;
            const workflows = new Map([
              ['.github/workflows/binary-size.yml', 'Binary Size'],
              ['.github/workflows/gungraun.yml', 'Gungraun Benchmarks'],
              ['.github/workflows/gungraun-js.yml', 'JavaScript API Gungraun'],
            ]);
            const conclusions = new Set([
              'success', 'failure', 'neutral', 'cancelled', 'skipped',
              'timed_out', 'action_required', 'stale', 'startup_failure',
            ]);
            const positive = value => Number.isSafeInteger(value) && value > 0;
            if (context.repo.owner !== owner || context.repo.repo !== repo ||
                !positive(event?.id) || !positive(event?.run_attempt)) {
              return skip('invalid event or destination repository');
            }
            const getRun = async () => (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: event.id,
            })).data;
            const run = await getRun();
            const name = workflows.get(run.path);
            if (!name || !positive(run.workflow_id)) return skip('unrecognized workflow');
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: run.path.split('/').pop(),
            });
            const validRun = current =>
              current.id === event.id && current.repository?.full_name === repository &&
              current.workflow_id === workflow.id && current.path === workflow.path &&
              current.path === run.path && current.event === 'pull_request' &&
              current.status === 'completed' && conclusions.has(current.conclusion) &&
              current.run_attempt === event.run_attempt &&
              /^[0-9a-f]{40}$/.test(current.head_sha) &&
              current.head_sha === run.head_sha &&
              positive(current.head_repository?.id) &&
              current.head_repository.id === run.head_repository?.id &&
              current.head_repository.id !== current.repository.id;
            if (!validRun(run)) return skip('run identity, event, attempt, or fork mismatch');

            let candidates = run.pull_requests ?? [];
            if (!candidates.length) {
              candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: run.head_sha, per_page: 100,
              });
            }
            // GitHub can omit fork PRs from both run and commit associations.
            // Use the source branch only to find candidates; verify their IDs and SHA below.
            if (!candidates.length) {
              const login = run.head_repository.owner?.login;
              if (!login || !run.head_branch) return skip('missing fork branch identity');
              candidates = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', head: `${login}:${run.head_branch}`, per_page: 100,
              });
            }
            const matches = pr => pr.state === 'open' &&
              pr.base?.repo?.full_name === repository &&
              pr.base.repo.id === run.repository.id &&
              pr.head?.repo?.id === run.head_repository.id &&
              pr.head.sha === run.head_sha;
            const verified = [];
            for (const number of new Set(candidates.map(pr => pr.number))) {
              if (!positive(number)) continue;
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (matches(pr)) verified.push(pr);
            }
            if (verified.length !== 1) return skip('expected exactly one current open fork PR');
            const number = verified[0].number;
            const marker = `<!-- fork-ci-links:${number} -->`;
            const workflowIds = [];
            const rows = [];
            // Rebuild every row from trusted API data. A queued report may be replaced.
            for (const [path, label] of workflows) {
              const { data: source } = path === workflow.path ? { data: workflow } :
                await github.rest.actions.getWorkflow({
                  owner, repo, workflow_id: path.split('/').pop(),
                });
              if (!positive(source.id) || source.path !== path) return skip('workflow identity mismatch');
              workflowIds.push(source.id);
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: source.id, event: 'pull_request',
                head_sha: run.head_sha, status: 'completed', per_page: 100,
              });
              const result = runs.filter(candidate =>
                positive(candidate.id) && positive(candidate.run_attempt) &&
                positive(candidate.run_number) && candidate.workflow_id === source.id &&
                candidate.path === path && candidate.repository?.full_name === repository &&
                candidate.repository.id === run.repository.id &&
                candidate.head_repository?.id === run.head_repository.id &&
                candidate.head_branch === run.head_branch && candidate.head_sha === run.head_sha &&
                candidate.event === 'pull_request' && candidate.status === 'completed' &&
                conclusions.has(candidate.conclusion)
              ).sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
              if (result) {
                const url = `https://github.com/${repository}/actions/runs/${result.id}/attempts/${result.run_attempt}`;
                rows.push(`| ${label} | **${result.conclusion}** | [View workflow run](${url}) |`);
              } else {
                rows.push(`| ${label} | Pending | — |`);
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const markers = [marker, ...workflowIds.map(id => `<!-- fork-ci-link:${id}:${number} -->`)];
            const owned = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.user.type === 'Bot' &&
              markers.some(value => comment.body?.startsWith(`${value}\n`))
            ).sort((a, b) => a.id - b.id);
            const existing = owned.find(comment => comment.body.startsWith(`${marker}\n`)) ?? owned[0];

            // Recheck after discovery and pagination, immediately before publishing.
            const latest = await getRun();
            const { data: currentPr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (!validRun(latest) || !matches(currentPr)) return skip('run or PR changed before publication');
            const body = [marker, '### Fork CI results', '',
              `Commit: \`${run.head_sha}\``, '',
              '| Workflow | Result | Run |', '| --- | --- | --- |', ...rows,
            ].join('\n');
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            // Remove legacy or duplicate reports only after the combined report is published.
            for (const comment of owned) {
              if (comment.id !== existing?.id) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }
            core.info(`Published CI link for PR ${number}, workflow ${workflow.id}, run ${run.id}, attempt ${run.run_attempt}`);
