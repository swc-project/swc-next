name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: ["opened", "reopened", "synchronize"]

jobs:
  cargo-fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    env:
      RUST_LOG: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cargo-clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          components: clippy
      - run: cargo clippy --all --all-targets -- -D warnings

  cargo-shear:
    name: Cargo shear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-shear
      - name: cargo-shear
        run: cargo shear --fix

  cargo-check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
      - name: Run cargo check for all targets
        run: cargo check --all --all-targets

  cargo-test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
          - name: macos-latest
            os: macos-latest
          - name: windows-latest
            os: windows-latest
          - name: s390x
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        if: matrix.name == 's390x'
        with:
          tool: cross
      - name: Run tests
        run: >-
          ${{ matrix.name == 's390x' && 'cross' || 'cargo' }} test --workspace --locked
          ${{ matrix.name == 's390x' && '--target s390x-unknown-linux-gnu' || '' }}

  wasm-build:
    name: Build WebAssembly bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          target: wasm32-unknown-unknown
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Build WebAssembly bindings
        run: pnpm build:wasm --profile wasm-release
      - name: Prepare browser package
        run: node scripts/wasm-package/cli.mjs prepare-browser --source-dir npm/core/src-js
      - name: Run Node.js WebAssembly tests
        run: pnpm test:wasm
      - name: Install Chromium Headless Shell
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run browser WebAssembly smoke tests
        run: pnpm test:browser

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Clone test fixtures
        run: ./scripts/clone_fixtures.sh
      - name: Run conformance
        run: cargo run --locked -p testsuite --bin conformance --profile conformance
      - name: Run formatter conformance
        run: cargo run --locked -p testsuite --bin formatter_conformance --profile conformance
      - name: Build Node.js bindings
        run: pnpm build --release
      - name: Run ESTree conformance
        run: pnpm test:conformance
      - name: Run codec conformance
        run: pnpm test:codec
      - name: Run JavaScript tests
        run: pnpm test
      - name: Check conformance snapshots
        run: git diff --exit-code -- tasks/testsuite/snapshots
