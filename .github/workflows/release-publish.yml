name: Release Publish

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release pull request number
        required: true
        type: number
      release_crates:
        description: Release Rust crates
        required: true
        type: boolean
        default: true
      release_npm:
        description: Release NPM packages
        required: true
        type: boolean
        default: true
      test_npm:
        description: Run JavaScript tests before publishing NPM packages
        required: true
        type: boolean
        default: true
      dry_run:
        description: Add --dry-run to publish commands
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require a release target
        env:
          RELEASE_CRATES: ${{ inputs.release_crates }}
          RELEASE_NPM: ${{ inputs.release_npm }}
        run: |
          if [ "$RELEASE_CRATES" != "true" ] && [ "$RELEASE_NPM" != "true" ]; then
            echo "At least one release target must be selected." >&2
            exit 1
          fi

  release_crates:
    name: Release crates
    if: >-
      inputs.release_crates && !cancelled() &&
      needs.validate.result == 'success' &&
      needs.build_npm.result == 'success' &&
      needs.build_wasm.result == 'success'
    needs:
      - validate
      - build_npm
      - build_wasm
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout PR ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --version 0.4.2 --locked

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@a1c979fa8eec9cf00f2c01904184fe133deb0ce9 # v1

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo ws publish --force "swc*" --publish-as-is ${{ inputs.dry_run && '--dry-run' || '' }}

  build_npm:
    name: Build ${{ matrix.target }}
    if: inputs.release_crates || inputs.release_npm
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            extra_args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            extra_args: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extra_args: --use-napi-cross
            target_cc: /usr/bin/clang
            llvm_target: aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            extra_args: --cross-compile
          # Use the Ubuntu 22.04 cross sysroot to build against glibc 2.35.
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            extra_args: ""
            gnu_cross_prefix: arm-linux-gnueabihf
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            extra_args: --use-napi-cross
            target_cc: /usr/bin/clang
            llvm_target: ppc64le
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            extra_args: ""
            gnu_cross_prefix: riscv64-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            extra_args: --cross-compile
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            extra_args: --use-napi-cross
            target_cc: /usr/bin/clang
            llvm_target: systemz
          # The host and target match, so cc-rs ignores TARGET_CC and compiles C
          # with the runner's headers. glibc 2.38+ headers turn mimalloc's
          # strtol into __isoc23_strtol, which breaks glibc 2.35 systems.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extra_args: --use-napi-cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            extra_args: --cross-compile
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            extra_args: ""
          - os: windows-latest
            target: i686-pc-windows-msvc
            extra_args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_args: ""
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout PR ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          target: ${{ matrix.target }}

      - name: Set up Zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      # NAPI's bundled GCC does not support mimalloc's date-time warning flag.
      # https://github.com/swc-project/swc-next/pull/1409
      - name: Set up Clang for GNU cross builds
        if: matrix.target_cc != ''
        shell: bash
        env:
          TARGET_CC: ${{ matrix.target_cc }}
          LLVM_TARGET: ${{ matrix.llvm_target }}
        run: |
          if ! command -v "$TARGET_CC" >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes clang
          fi
          "$TARGET_CC" --version
          "$TARGET_CC" --print-targets | grep --word-regexp "$LLVM_TARGET" || {
            echo "::error::Clang does not support the $LLVM_TARGET target"
            exit 1
          }
          echo "TARGET_CC=$TARGET_CC" >> "$GITHUB_ENV"

      - name: Set up GNU cross compiler
        if: matrix.gnu_cross_prefix != ''
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          GNU_CROSS_PREFIX: ${{ matrix.gnu_cross_prefix }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes "gcc-$GNU_CROSS_PREFIX" "g++-$GNU_CROSS_PREFIX"
          target_key="${BUILD_TARGET//-/_}"
          {
            echo "CARGO_TARGET_${target_key^^}_LINKER=$GNU_CROSS_PREFIX-gcc"
            echo "CC_$target_key=$GNU_CROSS_PREFIX-gcc"
            echo "CXX_$target_key=$GNU_CROSS_PREFIX-g++"
            echo "AR_$target_key=$GNU_CROSS_PREFIX-ar"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native bindings
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXTRA_ARGS: ${{ matrix.extra_args }}
        run: pnpm build --release --target "$BUILD_TARGET" $EXTRA_ARGS

      - name: Run JavaScript tests
        if: >-
          inputs.test_npm &&
          (
            matrix.target == 'x86_64-unknown-linux-gnu' ||
            matrix.target == 'x86_64-pc-windows-msvc' ||
            (runner.arch == 'X64' && matrix.target == 'x86_64-apple-darwin') ||
            (runner.arch == 'ARM64' && matrix.target == 'aarch64-apple-darwin')
          )
        run: pnpm test

      - name: Upload native bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: bindings-${{ matrix.target }}
          path: npm/*/dist/*.node

  build_wasm:
    name: Build wasm32-unknown-unknown
    if: inputs.release_crates || inputs.release_npm
    needs: validate
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - name: Checkout PR ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          target: wasm32-unknown-unknown
          rustflags: "" # Use the workspace's target-specific flags.

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebAssembly bindings
        run: pnpm build:wasm --profile wasm-release

      - name: Upload WebAssembly bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: bindings-wasm32-unknown-unknown
          path: |
            npm/*/dist/*.wasm
            npm/*/dist/*.bridge.mjs
            npm/*/dist/*.node.mjs
            npm/*/dist/*.browser.mjs
            npm/*/dist/*.module.mjs
            npm/*/dist/*.runtime.mjs

  release_npm:
    name: Release NPM packages
    if: >-
      inputs.release_npm && !cancelled() &&
      needs.validate.result == 'success' &&
      needs.build_npm.result == 'success' &&
      needs.build_wasm.result == 'success' &&
      (!inputs.release_crates || needs.release_crates.result == 'success')
    needs:
      - validate
      - build_npm
      - build_wasm
      - release_crates
    runs-on: ubuntu-latest
    environment: npm
    env:
      # Package assembly adds unpublished bindings to the workspace manifests.
      pnpm_config_verify_deps_before_run: "false"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout PR ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/head

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binding artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble NPM packages
        run: |
          napi_cli="./node_modules/.bin/napi"
          while IFS= read -r package_dir; do
            component="${package_dir##*/}"
            package_json="$package_dir/package.json"
            npm_dir="release-dir/$component"
            "$napi_cli" create-npm-dirs --package-json-path "$package_json" --npm-dir "$npm_dir"
            "$napi_cli" artifacts --package-json-path "$package_json" --output-dir artifacts --npm-dir "$npm_dir"
            "$napi_cli" pre-publish --package-json-path "$package_json" --npm-dir "$npm_dir" --tag-style npm --no-gh-release --skip-optional-publish
          done < <(node .github/scripts/release/version.mjs npm-packages)

          wasm_cli="scripts/wasm-package/cli.mjs"
          while IFS= read -r package_dir; do
            component="${package_dir##*/}"
            package_json="$package_dir/package.json"
            npm_dir="release-dir/$component"
            node "$wasm_cli" create-npm-dirs --package-json-path "$package_json" --npm-dir "$npm_dir"
            node "$wasm_cli" artifacts --package-json-path "$package_json" --output-dir artifacts --npm-dir "$npm_dir"
            node "$wasm_cli" pre-publish --package-json-path "$package_json" --npm-dir "$npm_dir" --tag-style npm --no-gh-release --skip-optional-publish
          done < <(node .github/scripts/release/version.mjs wasm-packages)

          pnpm prepare:browser --source-dir ../../release-dir/core/wasm32-unknown-unknown

      - name: Build JavaScript APIs
        run: pnpm build:js

      - name: Publish NPM packages
        run: node .github/scripts/release/publish-npm.mjs release-dir ${{ inputs.dry_run && '--dry-run' || '' }}
