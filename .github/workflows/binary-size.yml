name: Binary Size

on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read

concurrency:
  group: binary-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  binary-size:
    name: Compare binary sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base-core: ${{ steps.base.outputs.core }}
      base-parser: ${{ steps.base.outputs.parser }}
      base-codegen: ${{ steps.base.outputs.codegen }}
      merge-core: ${{ steps.merge.outputs.core }}
      merge-parser: ${{ steps.merge.outputs.parser }}
      merge-codegen: ${{ steps.merge.outputs.codegen }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare shared build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/binary-size-target" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
        with:
          toolchain: 1.97.1
          target: x86_64-unknown-linux-gnu
          cache-save-if: false
          cache-key: binary-size
          cache-workspaces: ". -> ${{ runner.temp }}/binary-size-target"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Measure base bindings
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/binary-size-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/binary-size-base"
          pnpm install --frozen-lockfile
          pnpm build --release --target x86_64-unknown-linux-gnu -- --locked
          for component in core parser codegen; do
            bytes=$(stat --format=%s "npm/$component/src-js/swc-next-$component.linux-x64-gnu.node")
            echo "$component=$bytes" >> "$GITHUB_OUTPUT"
          done

      - name: Measure merge bindings
        id: merge
        run: |
          pnpm install --frozen-lockfile
          pnpm build --release --target x86_64-unknown-linux-gnu -- --locked
          for component in core parser codegen; do
            bytes=$(stat --format=%s "npm/$component/src-js/swc-next-$component.linux-x64-gnu.node")
            echo "$component=$bytes" >> "$GITHUB_OUTPUT"
          done

  report:
    name: Report binary sizes
    needs: binary-size
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Render binary size report
        env:
          BUILD_RESULT: ${{ needs.binary-size.result }}
          MEASUREMENTS: ${{ toJSON(needs.binary-size.outputs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPARE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          lines = [
              "<!-- binary-size-diff -->",
              "## Binary size diff",
              "",
              "Linux x64 GNU · release · uncompressed, stripped bindings.",
              "",
              f"Merge: `{os.environ['COMPARE_SHA']}`; base: `{os.environ['BASE_SHA']}`.",
              "",
          ]
          if os.environ["BUILD_RESULT"] == "success":
              sizes = json.loads(os.environ["MEASUREMENTS"])
              components = ("core", "parser", "codegen")
              expected = {f"{revision}-{component}" for revision in ("base", "merge") for component in components}
              if set(sizes) != expected or any(
                  not isinstance(value, str) or not re.fullmatch(r"[1-9][0-9]{0,15}", value)
                  or int(value) > 9007199254740991 for value in sizes.values()
              ):
                  raise ValueError("Invalid binary size measurements")
              lines += [
                  "| Artifact | Merge | Base | Change (bytes) | Change (%) |",
                  "| --- | ---: | ---: | ---: | ---: |",
              ]
              for component in components:
                  before = int(sizes[f"base-{component}"])
                  after = int(sizes[f"merge-{component}"])
                  delta = after - before
                  sign = "+" if delta > 0 else ""
                  status = "🔴" if delta > 0 else "🟢" if delta < 0 else "⚪"
                  lines.append(
                      f"| `@swc-next/{component}` | {after / 1024:,.2f} KiB | {before / 1024:,.2f} KiB "
                      f"| {sign}{delta:,} | {sign}{delta / before * 100:.3f}% {status} |"
                  )
          else:
              lines.append("⚠️ Binary size comparison unavailable. See the workflow log.")
          body = "\n".join(lines) + "\n"
          Path(os.environ["RUNNER_TEMP"], "binary-size-comment.md").write_text(body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(body)
          PYTHON

      - name: Publish binary size diff to pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          comment="$RUNNER_TEMP/binary-size-comment.md"
          if [[ ! -s "$comment" ]]
          then
            exit 1
          fi
          current_head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [[ "$current_head" != "$PR_HEAD_SHA" ]]
          then
            echo 'Skipping report for an outdated PR revision.'
            exit 0
          fi
          comment_id="$(
            gh api --paginate --slurp \
              "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" | \
              jq -r \
              'flatten | map(select(.user.login == "github-actions[bot]" and (.body | contains("<!-- binary-size-diff -->")))) | first | .id // empty'
          )"
          if [[ -n "$comment_id" ]]
          then
            gh api --method PATCH \
              "repos/$GH_REPO/issues/comments/$comment_id" \
              -F body=@"$comment"
          else
            gh api --method POST \
              "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -F body=@"$comment"
          fi
