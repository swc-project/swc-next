[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_bridge"
repository.workspace  = true
version               = "0.3.1"

[lib]
crate-type = ["lib", "cdylib"]

[features]
codegen = ["dep:swc_next_ecma_codegen"]
parser  = ["dep:swc_next_ecma_parser", "dep:swc_next_ecma_semantic"]

[dependencies]
swc_next_allocator     = { workspace = true }
swc_next_bridge_macros = { workspace = true }
swc_next_ecma_ast      = { workspace = true }
swc_next_ecma_codegen  = { workspace = true, optional = true }
swc_next_ecma_parser   = { workspace = true, optional = true }
swc_next_ecma_semantic = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `#[bridge]` expands to NAPI-RS types and attributes for native targets.
napi        = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
