[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_bridge"
repository.workspace  = true
version               = "0.6.1"

[lib]
crate-type = ["lib", "cdylib"]

[features]
ecma-formatter = ["dep:swc_next_ecma_ast", "dep:swc_next_ecma_formatter", "dep:swc_next_ecma_parser", "dep:swc_next_formatter_core"]
formatter      = ["dep:swc_next_formatter_core", "dep:swc_next_formatter_host"]

[dependencies]
swc_next_bridge_macros  = { workspace = true }
swc_next_ecma_ast       = { workspace = true, optional = true }
swc_next_ecma_formatter = { workspace = true, optional = true }
swc_next_ecma_parser    = { workspace = true, optional = true }
swc_next_formatter_core = { workspace = true, optional = true }
swc_next_formatter_host = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `#[bridge]` expands to NAPI-RS types and attributes for native targets.
encoding_rs = { workspace = true }
napi        = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
