[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_ecma_transformer"
repository.workspace  = true
version               = "0.6.1"

[dependencies]
memchr     = { workspace = true }
phf        = { workspace = true, features = ["macros"] }
rustc-hash = { workspace = true }
zmij_ecma  = { workspace = true }

swc_next_allocator     = { workspace = true }
swc_next_ecma_ast      = { workspace = true }
swc_next_ecma_semantic = { workspace = true }

[dev-dependencies]
clap                  = { workspace = true }
insta                 = { workspace = true, features = ["glob"] }
serde_json            = { workspace = true }
swc_next_core         = { workspace = true, features = ["js_transformer", "serde"] }
swc_next_ecma_codegen = { workspace = true }
swc_next_ecma_parser  = { workspace = true }
