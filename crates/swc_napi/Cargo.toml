[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_napi"
repository.workspace  = true
version               = "0.1.3"

[package.metadata.cargo-shear]
ignored = ["napi"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
codegen = ["dep:swc_next_ecma_codegen"]
parser = ["dep:swc_next_ecma_parser"]

[dependencies]
napi                 = { workspace = true }
napi-derive          = { workspace = true }
swc_next_allocator   = { workspace = true }
swc_next_ecma_ast    = { workspace = true }
swc_next_ecma_codegen = { workspace = true, optional = true }
swc_next_ecma_parser = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }
