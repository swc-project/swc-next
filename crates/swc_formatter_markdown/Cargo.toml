[package]
description           = "Experimental and unstable Markdown document formatting for SWC Next"
edition               = "2024"
homepage.workspace    = true
keywords              = ["markdown", "formatting", "pretty-printing"]
license.workspace     = true
name                  = "swc_next_formatter_markdown"
repository.workspace  = true
version               = "0.8.0"

[dependencies]
memchr                   = { workspace = true }
swc_next_formatter_core  = { workspace = true }
swc_next_formatter_host  = { workspace = true }
swc_next_markdown_parser = { workspace = true }
swc_next_simd            = { workspace = true, features = ["memchr"] }
