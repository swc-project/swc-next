[package]
description           = "JavaScript minification for the SWC Next AST"
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_ecma_minifier"
repository.workspace  = true
version               = "0.2.4"

[dependencies]
serde = { workspace = true, features = ["derive"] }

swc_next_ecma_ast = { workspace = true }
swc_next_ecma_semantic = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
serde_json    = { workspace = true }
tempfile      = { workspace = true }

swc_next_allocator     = { workspace = true }
swc_next_ecma_codegen  = { workspace = true }
swc_next_ecma_parser   = { workspace = true }

[[test]]
name    = "fixtures"
path    = "tests/fixtures.rs"
harness = false
