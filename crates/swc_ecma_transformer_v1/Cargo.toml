[package]
description           = "SWC JavaScript transform passes ported to the SWC Next AST"
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_ecma_transformer_v1"
publish               = false
repository.workspace  = true
version               = "0.7.0"

[dependencies]
base64             = { workspace = true }
browserslist       = { workspace = true }
convert_case       = { workspace = true }
hashbrown          = { workspace = true }
indexmap           = { workspace = true }
memchr             = { workspace = true }
rustc-hash         = { workspace = true }
sha1               = { workspace = true }
swc_next_allocator = { workspace = true }
swc_next_ecma_ast  = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
insta                = { workspace = true, features = ["glob"] }
serde_json           = { workspace = true }
swc_next             = { workspace = true, features = ["js_transformer_v1", "serde"] }
swc_next_ecma_parser = { workspace = true }
