[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_core"
repository.workspace  = true
version               = "0.5.0"

[features]
bridge = ["dep:swc_next_bridge"]
serde  = ["dep:serde"]

js             = ["dep:swc_next_allocator", "dep:swc_next_ecma_ast"]
js_generator   = ["js", "dep:swc_next_ecma_codegen"]
js_minifier    = ["js", "js_parser", "js_generator", "dep:swc_next_ecma_minifier", "dep:serde_json"]
js_parser      = ["js", "dep:swc_next_ecma_parser", "dep:swc_next_ecma_semantic"]
js_transformer = ["js", "js_parser", "js_generator", "dep:swc_next_ecma_transformer", "dep:serde_json"]

[dependencies]
serde                     = { workspace = true, optional = true, features = ["derive"] }
serde_json                = { workspace = true, optional = true }
swc_next_allocator        = { workspace = true, optional = true }
swc_next_bridge           = { workspace = true, optional = true }
swc_next_ecma_ast         = { workspace = true, optional = true }
swc_next_ecma_codegen     = { workspace = true, optional = true }
swc_next_ecma_minifier    = { workspace = true, optional = true }
swc_next_ecma_parser      = { workspace = true, optional = true }
swc_next_ecma_semantic    = { workspace = true, optional = true }
swc_next_ecma_transformer = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
