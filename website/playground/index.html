<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("swc-next-theme") === "light" ? "light" : "dark";
      } catch {
        // Keep the default theme when storage is unavailable.
      }
    </script>
    <style>
      html {
        color-scheme: dark;
        background: #08090a;
      }
      html[data-theme="light"] {
        color-scheme: light;
        background: #fcfcfc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
