[package]
description       = "Browser playground for the SWC Next parser, transformer, and code generator"
edition           = "2024"
license.workspace = true
name              = "playground"
publish           = false
version           = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]
path       = "src/lib.rs"

[dependencies]
serde                     = { workspace = true, features = ["derive"] }
serde_json                = { workspace = true }
swc_next_allocator        = { workspace = true }
swc_next_ecma_ast         = { workspace = true }
swc_next_ecma_codegen     = { workspace = true }
swc_next_ecma_parser      = { workspace = true }
swc_next_ecma_semantic    = { workspace = true }
swc_next_ecma_transformer = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
swc_next_bridge = { workspace = true }
