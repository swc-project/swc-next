[package]
description       = "Browser playground for the SWC Next parser, transformer, and code generator"
edition           = "2024"
license.workspace = true
name              = "playground"
publish           = false
version           = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]
path       = "src/lib.rs"

[dependencies]
swc_next        = { workspace = true, features = ["bridge", "js_transformer_v1"] }
swc_next_bridge = { workspace = true }
