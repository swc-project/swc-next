[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_core_bridge"
repository.workspace  = true
version               = "0.4.1"

[lib]
crate-type = ["cdylib"]

[features]
test-codec = ["dep:swc_next_allocator", "dep:swc_next_ecma_codegen", "dep:swc_next_ecma_parser"]

[dependencies]
swc_next_allocator    = { workspace = true, optional = true }
swc_next_bridge       = { workspace = true, features = ["codegen", "parser"] }
swc_next_ecma_ast     = { workspace = true }
swc_next_ecma_codegen = { workspace = true, optional = true }
swc_next_ecma_parser  = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { workspace = true, features = ["v2"] }

[build-dependencies]
napi-build = { workspace = true }
