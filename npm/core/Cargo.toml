[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_core_bridge"
repository.workspace  = true
version               = "0.1.3"

[package.metadata.cargo-shear]
ignored = ["napi-derive"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi              = { workspace = true }
# @napi-rs/cli detects binding crates through this direct dependency.
napi-derive       = { workspace = true }
swc_next_bridge   = { workspace = true, features = ["codegen", "parser"] }
swc_next_ecma_ast = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
