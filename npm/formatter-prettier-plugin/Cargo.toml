[package]
description           = "Experimental and unstable native and Wasm bindings for the SWC Next Prettier plugin"
edition               = "2024"
homepage.workspace    = true
keywords              = ["formatting", "pretty-printing"]
license.workspace     = true
name                  = "swc_next_formatter_prettier_plugin_bridge"
repository.workspace  = true
version               = "0.8.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
swc_next                    = { workspace = true, features = ["bridge", "js_parser"] }
swc_next_bridge             = { workspace = true }
swc_next_formatter          = { workspace = true, features = ["bridge"] }
swc_next_formatter_core     = { workspace = true }
swc_next_formatter_host     = { workspace = true }
swc_next_formatter_markdown = { workspace = true }
swc_next_markdown_parser    = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
