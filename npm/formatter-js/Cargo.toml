[package]
description           = "Experimental and unstable native and Wasm JavaScript and TypeScript formatter bindings"
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_formatter_js_bridge"
repository.workspace  = true
version               = "0.3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
swc_next_bridge = { workspace = true }
swc_next_core   = { workspace = true, features = ["bridge", "js_formatter"] }

[build-dependencies]
napi-build = { workspace = true }
