[package]
description.workspace = true
edition               = "2024"
homepage.workspace    = true
keywords.workspace    = true
license.workspace     = true
name                  = "swc_next_formatter_js_bridge"
repository.workspace  = true
version               = "0.3.0"

[lib]
crate-type = ["cdylib"]

[features]
test-native = [
    "dep:napi",
    "dep:serde_json",
    "dep:swc_next_ecma_ast",
    "dep:swc_next_ecma_parser",
    "dep:swc_next_formatter_js",
]

[dependencies]
swc_next_bridge = { workspace = true, features = ["formatter-js"] }
swc_next_core   = { workspace = true, features = ["bridge", "js_parser"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi                    = { workspace = true, optional = true, features = ["serde-json"] }
serde_json              = { workspace = true, optional = true }
swc_next_ecma_ast       = { workspace = true, optional = true }
swc_next_ecma_parser    = { workspace = true, optional = true }
swc_next_formatter_js   = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }
