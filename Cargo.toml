[workspace]
members  = ["crates/*", "tasks/ast_tools", "tasks/benchmark", "tasks/testsuite"]
resolver = "3"

[workspace.package]
description = "An extensible Rust-based platform for the next generation of fast developer tools"
homepage    = "https://swc.rs/"
keywords    = ["JavaScript"]
license     = "Apache-2.0"
repository  = "https://github.com/CPunisher/swc-experimental"

[workspace.dependencies]
allocator-api2   = "=0.2.21"
bitflags         = "2.13.0"
bumpalo          = "3.20.3"
either           = "1.16.0"
hashbrown        = "0.17.1"
indexmap         = "2.14.0"
insta            = "1.48.0"
miette           = "7.6.0"
num-bigint       = "0.4.6"
oxc_index        = { version = "5.0.0", features = ["nonmax"] }
rayon            = "1.12.0"
rustc-hash       = "2.1.2"
seq-macro        = "0.3.6"
similar          = "2.7.0"
smartstring      = "1.0.1"
stacker          = "0.1.24"
tracing          = "0.1.44"
unicode-id-start = "1.4.0"

# SWC
swc_core = { version = "71.0.3", features = [
    "ecma_ast",
    "ecma_codegen",
    "__ecma",
    "__visit",
    "__common",
    "__parser",
    "__ecma_transforms",
] }

# Ast tool
convert_case = "0.11.0"
phf          = "0.14.0"
prettyplease = "0.2.37"
proc-macro2  = "1.0.106"
quote        = "1.0.46"
syn          = { version = "2.0.118", default-features = false }

# Workspace
swc_experimental_allocator            = { version = "0.11.0", path = "crates/swc_allocator" }
swc_experimental_ast_macros           = { version = "0.11.0", path = "crates/swc_ast_macros" }
swc_experimental_ecma_ast             = { version = "0.11.0", path = "crates/swc_ecma_ast" }
swc_experimental_ecma_ast_compat      = { version = "0.11.0", path = "crates/swc_ecma_ast_compat" }
swc_experimental_ecma_codegen         = { version = "0.11.0", path = "crates/swc_ecma_codegen" }
swc_experimental_ecma_parser          = { version = "0.11.0", path = "crates/swc_ecma_parser" }
swc_experimental_ecma_semantic        = { version = "0.11.0", path = "crates/swc_ecma_semantic" }
swc_experimental_ecma_transforms_base = { version = "0.11.0", path = "crates/swc_ecma_transforms_base" }
swc_experimental_ecma_visit           = { version = "0.11.0", path = "crates/swc_ecma_visit" }

# Dev
colored      = "3.1.1"
criterion    = { package = "codspeed-criterion-compat", version = "5.0.0" }
jwalk        = "0.8.1"
mimalloc     = "0.1.52"
pico-args    = "0.5.0"
saphyr       = "0.0.6"
tracy-client = { version = "=0.18.1", features = ["enable", "sampling", "demangle", "system-tracing"] }

oxc           = { version = "0.137.0", features = ["ast_visit", "semantic"] }
oxc_allocator = "0.137.0"

[profile.bench]
codegen-units = 1
debug         = true
lto           = "fat"
opt-level     = 3
strip         = "none"
