[workspace]
members  = ["crates/*", "napi/*", "tasks/ast_tools", "tasks/benchmark", "tasks/testsuite"]
resolver = "3"

[workspace.package]
description = "An extensible Rust-based platform for the next generation of fast developer tools"
homepage    = "https://swc.rs/"
keywords    = ["JavaScript"]
license     = "Apache-2.0"
repository  = "https://github.com/swc-project/swc-next"

[workspace.dependencies]
allocator-api2   = "=0.2.21"
arrayvec         = "0.7.8"
bitflags         = "2.13.0"
bumpalo          = "3.20.3"
hashbrown        = "0.17.1"
indexmap         = "2.14.0"
memchr           = "2.7.6"
nohash-hasher    = "0.2.0"
oxc_index        = { version = "5.0.0", features = ["nonmax"] }
rayon            = "1.12.0"
regex            = "1.12.2"
rustc-hash       = "2.1.2"
serde            = "1.0.229"
serde_json       = "1.0.145"
unicode-id-start = "1.4.0"
zmij_ecma        = "1.0.21"

# SWC
swc_core = { version = "71.0.3", features = [
    "ecma_ast",
    "ecma_codegen",
    "__ecma",
    "__visit",
    "__common",
    "__parser",
    "__ecma_transforms",
] }

# NAPI-RS
napi        = "3.12.0"
napi-build  = "2.4.0"
napi-derive = "3.6.1"

# Ast tool
convert_case = "0.11.0"
phf          = "0.14.0"
prettyplease = "0.2.37"
proc-macro2  = "1.0.106"
quote        = "1.0.46"
syn          = { version = "2.0.118", default-features = false }

# Workspace
swc_next_allocator        = { version = "0.1.0", path = "crates/swc_allocator" }
swc_next_ast_macros       = { version = "0.1.0", path = "crates/swc_ast_macros" }
swc_next_ecma_ast         = { version = "0.1.0", path = "crates/swc_ecma_ast" }
swc_next_ecma_codegen     = { version = "0.1.0", path = "crates/swc_ecma_codegen" }
swc_next_ecma_parser      = { version = "0.1.0", path = "crates/swc_ecma_parser" }
swc_next_regular_expression = { version = "0.1.0", path = "crates/swc_regular_expression" }
swc_next_ecma_semantic    = { version = "0.1.0", path = "crates/swc_ecma_semantic" }
swc_next_ecma_transformer = { version = "0.1.0", path = "crates/swc_ecma_transformer" }
swc_next_napi             = { version = "0.1.0", path = "crates/swc_napi" }
swc_next_type_strip       = { version = "0.1.0", path = "crates/swc_type_strip" }

# Dev
clap          = { version = "4.5.51", features = ["derive"] }
criterion     = { package = "codspeed-criterion-compat", version = "5.0.0" }
gungraun      = "0.19.4"
jwalk         = "0.8.1"
mimalloc      = "0.1.52"
oxc           = { version = "0.137.0", features = ["ast_visit", "semantic"] }
oxc_allocator = "0.137.0"
saphyr        = "0.0.6"
tracy-client  = { version = "=0.18.1", features = ["enable", "sampling", "demangle", "system-tracing"] }

[profile.bench]
codegen-units = 1
debug         = true
lto           = "fat"
opt-level     = 3
strip         = "none"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"

[profile.test]
codegen-units    = 256
debug-assertions = true
inherits         = "release"
lto              = "thin"
opt-level        = 2
overflow-checks  = true
