[workspace]
exclude = ["npm/core-browser"]
members = [
    "crates/*",
    "npm/*",
    "tasks/ast_tools",
    "tasks/benchmark",
    "tasks/bridge_cli",
    "tasks/testsuite",
    "website/playground",
]
resolver = "3"

[workspace.package]
description = "An extensible Rust-based platform for the next generation of fast developer tools"
homepage    = "https://swc.rs/"
keywords    = ["JavaScript"]
license     = "Apache-2.0"
repository  = "https://github.com/swc-project/swc-next"

[workspace.dependencies]
allocator-api2   = "=0.2.21"
arrayvec         = "0.7.8"
bitflags         = "2.13.2"
bumpalo          = "3.20.3"
cow-utils        = "0.1.3"
encoding_rs      = { version = "0.8.35", default-features = false }
hashbrown        = "0.17.1"
indexmap         = "2.14.2"
memchr           = "2.8.3"
num-bigint       = "0.5.1"
oxc_index        = { version = "5.0.0", features = ["nonmax"] }
rayon            = "1.12.0"
regex            = "1.13.1"
rustc-hash       = "2.1.3"
serde            = "1.0.229"
serde_json       = "1.0.154"
sourcemap        = "9.3.2"
unicode-id-start = "1.5.0"
zmij_ecma        = "1.0.23"

# SWC
swc_core = { version = "=82.2.0", features = [
    "ecma_ast",
    "ecma_codegen",
    "__ecma",
    "__visit",
    "__common",
    "__parser",
    "__ecma_transforms",
] }
swc_ts_fast_strip = "=59.0.2"

# NAPI-RS
napi        = "3.15.0"
napi-build  = "2.6.0"
napi-derive = "3.6.13"

# Bridge tooling
cargo_metadata = "0.23.1"
wasmparser     = { version = "0.262.0", default-features = false, features = ["std"] }

# Ast tool
convert_case = "0.12.0"
phf          = "0.14.0"
prettyplease = "0.3.0"
proc-macro2  = "1.0.107"
quote        = "1.0.47"
syn          = { version = "3.0.9", default-features = false }

# Workspace
swc_next_allocator             = { version = "0.4.0", path = "crates/swc_allocator" }
swc_next_ast_macros            = { version = "0.4.0", path = "crates/swc_ast_macros" }
swc_next_bridge                = { version = "0.4.0", path = "crates/swc_bridge" }
swc_next_bridge_macros         = { version = "0.4.0", path = "crates/swc_bridge_macros" }
swc_next_ecma_ast              = { version = "0.4.0", path = "crates/swc_ecma_ast" }
swc_next_ecma_codegen          = { version = "0.4.0", path = "crates/swc_ecma_codegen" }
swc_next_ecma_minifier         = { version = "0.4.0", path = "crates/swc_ecma_minifier" }
swc_next_ecma_parser           = { version = "0.4.0", path = "crates/swc_ecma_parser" }
swc_next_ecma_semantic         = { version = "0.4.0", path = "crates/swc_ecma_semantic" }
swc_next_ecma_transformer      = { version = "0.4.0", path = "crates/swc_ecma_transformer" }
swc_next_isolated_declarations = { version = "0.4.0", path = "crates/swc_isolated_declarations" }
swc_next_regular_expression    = { version = "0.4.0", path = "crates/swc_regular_expression" }
swc_next_simd                  = { version = "0.4.0", path = "crates/swc_simd" }
swc_next_type_strip            = { version = "0.4.0", path = "crates/swc_type_strip" }

# Dev
anyhow        = "1.0.104"
clap          = { version = "4.6.7", features = ["derive"] }
criterion     = { package = "codspeed-criterion-compat", version = "6.0.0" }
gungraun      = "0.20.0"
jwalk         = "0.9.0"
libtest-mimic = "0.8.2"
mimalloc      = "0.1.52"
oxc           = { version = "0.155.0", features = ["ast_visit", "semantic"] }
oxc_allocator = "0.155.0"
saphyr        = "0.3.1"
tempfile      = "3.27.0"
tracy-client  = { version = "=0.18.1", features = ["enable", "sampling", "demangle", "system-tracing"] }

[profile.bench]
codegen-units = 1
debug         = true
lto           = "fat"
opt-level     = 3
strip         = "none"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = "symbols"

[profile.wasm-release]
inherits = "release"
strip    = "symbols"

[profile.conformance]
codegen-units    = 256
debug-assertions = true
inherits         = "release"
lto              = "thin"
opt-level        = 2
overflow-checks  = true
panic            = "unwind"
strip            = "none"
