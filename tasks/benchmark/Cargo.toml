[package]
edition = "2024"
name    = "benchmark"
publish = false
version = "0.1.0"

[features]
codspeed = []
tracy    = ["dep:tracy-client"]

[dependencies]
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
oxc                            = { workspace = true }
oxc_allocator                  = { workspace = true }
swc_experimental_allocator     = { workspace = true }
swc_experimental_ecma_ast      = { workspace = true }
swc_experimental_ecma_parser   = { workspace = true, features = ["unstable"] }
swc_experimental_ecma_semantic = { workspace = true }

criterion  = { workspace = true }
mimalloc   = { workspace = true }
rustc-hash = { workspace = true }
swc_core   = { workspace = true, features = ["ecma_parser_unstable"] }

[[bench]]
harness = false
name    = "parser"

[[bench]]
harness = false
name    = "visit"

[[bench]]
harness = false
name    = "semantic"
