[package]
edition = "2024"
name    = "benchmark"
publish = false
version = "0.1.0"

[features]
codspeed = []
tracy    = []


[dev-dependencies]
oxc                    = { workspace = true }
oxc_allocator          = { workspace = true }
swc_next_allocator     = { workspace = true }
swc_next_ecma_ast      = { workspace = true }
swc_next_ecma_codegen  = { workspace = true }
swc_next_ecma_minifier = { workspace = true }
swc_next_ecma_parser   = { workspace = true, features = ["unstable"] }
swc_next_ecma_semantic    = { workspace = true }
swc_next_ecma_transformer = { workspace = true }
swc_next_type_strip       = { workspace = true, features = ["benchmarking"] }
tracy-client              = { workspace = true }

criterion  = { workspace = true }
gungraun   = { workspace = true }
mimalloc   = { workspace = true }
rustc-hash = { workspace = true }

[[bench]]
harness = false
name    = "gungraun"

[[bench]]
harness = false
name    = "parser"

[[bench]]
harness = false
name    = "visit"

[[bench]]
harness = false
name    = "semantic"

[[bench]]
harness = false
name = "gungraun_js"
path = "js/gungraun_js.rs"
