[package]
edition = "2024"
name    = "testsuite"
publish = false
version = "0.1.0"

[dependencies]
base64       = "0.23.1"
clap         = { workspace = true }
jsonc-parser = { workspace = true }
jwalk        = { workspace = true }
rayon        = { workspace = true }
regex        = { workspace = true }
saphyr       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }

swc_core                  = { workspace = true, features = ["base", "ecma_transforms_react", "ecma_preset_env"] }
swc_next                  = { workspace = true, features = ["js_transformer_v1", "js_transformer_v2", "serde"] }
swc_next_allocator        = { workspace = true }
swc_next_ecma_ast         = { workspace = true }
swc_next_ecma_codegen     = { workspace = true }
swc_next_ecma_minifier    = { workspace = true }
swc_next_ecma_parser      = { workspace = true }
swc_next_ecma_semantic    = { workspace = true }
swc_next_formatter        = { workspace = true, features = ["serde"] }
swc_next_formatter_core   = { workspace = true }
swc_next_formatter_host   = { workspace = true }
swc_next_formatter_js     = { workspace = true }
swc_next_markdown_parser  = { workspace = true }

[[bin]]
name = "conformance"

[[bin]]
name = "formatter"

[[bin]]
name = "debug"
